name: SBOM

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jsundquist/sbom@b9a97735cacd0dbc4810b50db3b9b6169caae971 # main
        with:
          dashboard-url: https://sbom.digital-portfolio.net
          api-token: ${{ secrets.SBOM_DASHBOARD_TOKEN }}
