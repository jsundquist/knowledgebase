name: SBOM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jsundquist/sbom@ab01c17277825fe36a23e50a2e1a413f7b7a6810 # v1.0.0
        with:
          dashboard-url: https://sbom.digital-portfolio.net
          api-token: ${{ secrets.SBOM_DASHBOARD_TOKEN }}
