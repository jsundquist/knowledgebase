[project]
name = "knowledgebase"
version = "0.1.0"
description = "MCP server for tracking key ideas, findings, and understanding per project"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "mcp>=1.30,<2",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pip-audit>=2.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.pyright]
include = ["src", "hooks"]
extraPaths = ["src", "hooks"]
pythonVersion = "3.11"
